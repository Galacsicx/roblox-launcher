<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Roblox Launcher Pro</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body {
            margin: 0;
            background: linear-gradient(135deg, #1b3b6f 0%, #0d1b36 100%);
            color: white;
            min-height: 100vh;
            padding: 30px;
        }
        .container { max-width: 1120px; margin: 0 auto; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            background: rgba(10, 22, 46, 0.75);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid #2e5699;
        }
        .left-header { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        .tabs { display: flex; gap: 8px; }
        .tab-btn {
            background: #13294d;
            border: 1px solid #3562ad;
            color: #b8d0fa;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .tab-btn.active {
            background: #3b82f6;
            color: white;
            border-color: #60a5fa;
        }

        .profile-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #13294d;
            padding: 7px 14px;
            border-radius: 8px;
            border: 1px solid #3b6ec2;
        }
        
        .avatar-container { position: relative; display: inline-block; flex-shrink: 0; }
        .avatar-wrap {
            width: 44px; height: 44px; border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: 2px solid #4ade80; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 18px; color: white; cursor: pointer;
        }
        .avatar-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .clear-avatar-btn {
            position: absolute; top: -6px; right: -6px; background: #ef4444; color: white;
            border: 2px solid #13294d; border-radius: 50%; width: 18px; height: 18px;
            font-size: 10px; font-weight: bold; display: flex; align-items: center;
            justify-content: center; cursor: pointer; z-index: 10; padding: 0; line-height: 1;
        }
        .clear-avatar-btn:hover { background: #dc2626; }

        .username-text { font-weight: bold; font-size: 15px; color: #ffffff; }
        .user-sub { font-size: 11px; color: #4ade80; }
        .login-input {
            background: #0d1b36; border: 1px solid #3b6ec2; color: white;
            padding: 7px 10px; border-radius: 5px; font-size: 13px; width: 180px; outline: none;
        }
        .small-btn {
            background: #3b82f6; color: white; border: none; padding: 7px 14px;
            border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 12px;
        }
        .small-btn:hover { background: #2563eb; }
        .logout-btn {
            background: transparent; border: 1px solid #ef4444; color: #f87171;
            padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; margin-left: 4px;
        }

        .control-bar {
            background: rgba(10, 22, 46, 0.75); border: 1px solid #2e5699;
            padding: 15px 20px; border-radius: 8px; margin-bottom: 25px;
            display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
        }
        .search-input {
            background: #13294d; border: 1px solid #3b6ec2; color: white;
            padding: 10px 14px; border-radius: 5px; font-size: 14px; outline: none; min-width: 270px;
        }
        .add-btn {
            background: #3b82f6; color: white; border: none; padding: 10px 18px;
            border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 14px;
        }
        .add-btn:hover { background: #2563eb; }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 18px;
        }
        .card {
            background: #122647; border: 1px solid #264882; border-radius: 8px;
            overflow: hidden; position: relative; transition: transform 0.2s, box-shadow 0.2s;
            display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.45); }
        .thumb-wrap { position: relative; height: 135px; background: #0f1f3d; overflow: hidden; }
        .thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
        .badge-online {
            position: absolute; top: 8px; left: 8px; background: rgba(0, 0, 0, 0.78);
            padding: 3px 8px; border-radius: 4px; font-size: 12px; color: #4ade80;
            font-weight: bold; z-index: 2;
        }
        .del-btn {
            position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.78);
            color: #ff6b6b; border: none; border-radius: 4px; cursor: pointer;
            padding: 3px 8px; font-weight: bold; z-index: 2;
        }
        .fav-btn {
            position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.78);
            color: #facc15; border: 1px solid #facc15; border-radius: 4px;
            cursor: pointer; padding: 2px 7px; font-size: 12px; z-index: 2;
        }
        .card-body { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .title { font-weight: bold; font-size: 15px; margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .play-btn {
            display: block; text-align: center; background: #f5d142; color: #141024;
            text-decoration: none; font-weight: bold; padding: 10px; border-radius: 5px; font-size: 14px;
        }
        .play-btn:hover { background: #ffe066; }

        .loader-container {
            grid-column: 1 / -1; text-align: center; padding: 30px;
            color: #93c5fd; font-size: 16px; font-weight: bold;
        }

        /* Стили для карточек друзей */
        .friend-card {
            background: #122647; border: 1px solid #264882; border-radius: 8px;
            padding: 15px; display: flex; flex-direction: column; align-items: center;
            cursor: pointer; transition: transform 0.2s, background 0.2s;
        }
        .friend-card:hover { transform: translateY(-4px); background: #1a3563; }
        .friend-avatar {
            width: 80px; height: 80px; border-radius: 50%;
            background: #0f1f3d; border: 3px solid #3b82f6; object-fit: cover; margin-bottom: 10px;
        }
        .friend-name { font-weight: bold; font-size: 16px; color: #fff; text-align: center; }
        .friend-username { font-size: 12px; color: #93c5fd; margin-bottom: 10px; }

        /* Стили для модального окна профиля (Steam-like) */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); z-index: 1000; justify-content: center; align-items: center;
        }
        .profile-modal {
            background: #13294d; width: 500px; max-width: 90%; border-radius: 12px;
            border: 1px solid #3b6ec2; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            overflow: hidden; position: relative;
        }
        .modal-header {
            background: linear-gradient(135deg, #1e40af, #0f172a); height: 120px;
            position: relative;
        }
        .modal-avatar {
            width: 100px; height: 100px; border-radius: 50%; border: 4px solid #13294d;
            position: absolute; bottom: -50px; left: 20px; background: #0f1f3d;
        }
        .modal-close {
            position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.5);
            color: white; border: none; border-radius: 50%; width: 30px; height: 30px;
            cursor: pointer; font-size: 16px; font-weight: bold;
        }
        .modal-body { padding: 60px 20px 20px 20px; }
        .modal-name { font-size: 24px; font-weight: bold; color: white; margin-bottom: 5px; }
        .modal-username { font-size: 14px; color: #93c5fd; margin-bottom: 15px; }
        .modal-stats { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid #2e5699; padding-bottom: 15px; }
        .stat-box { font-size: 13px; color: #b8d0fa; }
        .stat-value { font-weight: bold; color: white; font-size: 15px; display: block; margin-top: 4px; }
        .modal-desc { font-size: 14px; color: #b8d0fa; line-height: 1.5; font-style: italic; background: #0d1b36; padding: 10px; border-radius: 6px;}
        .modal-actions { margin-top: 20px; text-align: right; }
        .btn-remove { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold;}
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div class="left-header">
            <h2 style="margin:0;">Roblox Launcher</h2>
            <div class="tabs">
                <button class="tab-btn active" id="tabDiscover" onclick="switchTab('discover')">🔥 Games</button>
                <button class="tab-btn" id="tabMy" onclick="switchTab('my')">⭐ Library</button>
                <button class="tab-btn" id="tabFriends" onclick="switchTab('friends')">👥 Friends</button>
            </div>
        </div>
        <div class="profile-box" id="profileBox"></div>
    </div>

    <div class="control-bar" id="mainControlBar">
        <input type="text" class="search-input" id="searchInput" placeholder="Search by name or paste Game ID..." onkeyup="renderGames()">
        <button class="add-btn" onclick="addGameById()">+ Add Game by ID</button>
        <span id="status" style="color: #93c5fd; font-size: 13px;"></span>
    </div>

    <div class="control-bar" id="friendControlBar" style="display:none;">
        <input type="text" class="search-input" id="friendSearchInput" placeholder="Enter username to add friend..." onkeydown="if(event.key==='Enter') addFriendByUsername()">
        <button class="add-btn" onclick="addFriendByUsername()">+ Add Friend</button>
        <span id="friendStatus" style="color: #93c5fd; font-size: 13px;"></span>
    </div>

    <div class="games-grid" id="gamesGrid"></div>
    <div id="loader" class="loader-container" style="display:none;">⏳ Loading new games...</div>
</div>

<input type="file" id="filePicker" accept="image/*" style="display:none">

<!-- Модальное окно профиля -->
<div class="modal-overlay" id="profileModal" onclick="closeModal(event)">
    <div class="profile-modal" onclick="event.stopPropagation()">
        <div class="modal-header">
            <button class="modal-close" onclick="closeProfile()">✕</button>
            <img class="modal-avatar" id="modalAvatar" src="" alt="Avatar">
        </div>
        <div class="modal-body">
            <div class="modal-name" id="modalDisplayName">Name</div>
            <div class="modal-username" id="modalUsername">@username</div>
            
            <div class="modal-stats">
                <div class="stat-box">User ID <span class="stat-value" id="modalId">0</span></div>
                <div class="stat-box">Joined <span class="stat-value" id="modalJoined">Unknown</span></div>
            </div>

            <div class="modal-desc" id="modalDesc">No description provided.</div>

            <div class="modal-actions">
                <button class="btn-remove" id="modalRemoveBtn" onclick="removeFriendFromModal()">Remove Friend</button>
            </div>
        </div>
    </div>
</div>

<script>
window.onerror = function(msg) { console.error("JS Error:", msg); };

function safeParse(key, fallback) {
    try {
        const val = localStorage.getItem(key);
        if (!val || val === 'undefined' || val === 'null') return fallback;
        return JSON.parse(val) || fallback;
    } catch (e) { return fallback; }
}

function escapeHTML(str) {
    if (!str) return '';
    return String(str).replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
}

function makePoster(title, color1 = '#1e40af', color2 = '#0f172a') {
    const cleanTitle = escapeHTML(String(title || 'Roblox'));
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="768" height="432" viewBox="0 0 768 432">
        <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="${color1}"/>
                <stop offset="100%" stop-color="${color2}"/>
            </linearGradient>
        </defs>
        <rect width="768" height="432" fill="url(#g)"/>
        <circle cx="680" cy="70" r="140" fill="rgba(255,255,255,0.05)"/>
        <circle cx="90" cy="380" r="110" fill="rgba(59,130,246,0.12)"/>
        <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="38">${cleanTitle}</text>
        <text x="50%" y="70%" dominant-baseline="middle" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="18">ROBLOX EXPERIENCE</text>
    </svg>`;
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function toRoProxy(url) {
    return url
        .replace('https://users.roblox.com', 'https://users.roproxy.com')
        .replace('https://games.roblox.com', 'https://games.roproxy.com')
        .replace('https://thumbnails.roblox.com', 'https://thumbnails.roproxy.com')
        .replace('https://apis.roblox.com', 'https://apis.roproxy.com');
}

async function fetchRobloxGet(url) {
    const tryUrls = [toRoProxy(url), 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url)];
    for (const pUrl of tryUrls) {
        try {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 8000);
            const res = await fetch(pUrl, { signal: controller.signal });
            clearTimeout(timer);
            if (res.ok) {
                const data = await res.json();
                if (data && !data.errors) return data;
            }
        } catch (e) {}
    }
    return null;
}

let savedUser = safeParse('robloxUserProfile', null);
let myFriends = safeParse('myRobloxFriends', []);
let discoverGames = [];
let myGames = safeParse('myRobloxGames', []);
let currentTab = 'discover';
let isLoading = false;
let nextPageToken = null;
let currentSortId = 'top-trending';
const MAX_VISIBLE_GAMES = 20; 

function renderProfile() {
    const box = document.getElementById('profileBox');
    if (!box) return;
    
    if (savedUser) {
        const activeAvatar = savedUser.customAvatar || savedUser.avatar;
        const letter = (savedUser.displayName || savedUser.name || 'R').charAt(0).toUpperCase();
        const imgTag = activeAvatar ? `<img src="${activeAvatar}" onerror="this.remove()" alt="Avatar">` : '';
        const clearBtn = savedUser.customAvatar ? `<div class="clear-avatar-btn" onclick="event.stopPropagation(); removeCustomAvatar()" title="Restore Roblox avatar">✕</div>` : '';

        box.innerHTML = `
            <div class="avatar-container">
                <div class="avatar-wrap" onclick="pickCustomAvatar()" title="Click to upload custom image">
                    ${imgTag}${!activeAvatar ? letter : ''}
                </div>
                ${clearBtn}
            </div>
            <div>
                <div class="username-text">${escapeHTML(savedUser.displayName || savedUser.name)} <span style="color:#93c5fd; font-weight:normal; font-size:12px;">(@${escapeHTML(savedUser.name)})</span></div>
                <div class="user-sub">● ${savedUser.id ? 'ID: ' + savedUser.id : 'Click circle for image'}</div>
            </div>
            <button class="logout-btn" onclick="logoutUser()">Switch</button>`;
    } else {
        box.innerHTML = `
            <input type="text" class="login-input" id="usernameInput" placeholder="Username or User ID" onkeydown="if(event.key==='Enter') loginUser()">
            <button class="small-btn" onclick="loginUser()">Log in</button>`;
    }
}

function pickCustomAvatar() {
    const picker = document.getElementById('filePicker');
    picker.onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
            if (!savedUser) return;
            savedUser.customAvatar = reader.result;
            localStorage.setItem('robloxUserProfile', JSON.stringify(savedUser));
            renderProfile();
        };
        reader.readAsDataURL(file);
    };
    picker.click();
}

function removeCustomAvatar() {
    if (!savedUser) return;
    delete savedUser.customAvatar;
    localStorage.setItem('robloxUserProfile', JSON.stringify(savedUser));
    renderProfile();
}

async function loginUser() {
    const input = document.getElementById('usernameInput');
    const rawQuery = input.value.replace('@', '').trim();
    if (!rawQuery) return;
    input.disabled = true;
    input.value = 'Searching...';

    let userId = '', realName = rawQuery, displayName = rawQuery, avatarUrl = '';
    let oldCustomAvatar = savedUser ? savedUser.customAvatar : null;

    if (/^\d+$/.test(rawQuery)) {
        userId = rawQuery;
        const userInfo = await fetchRobloxGet(`https://users.roblox.com/v1/users/${userId}`);
        if (userInfo && userInfo.name) {
            realName = userInfo.name;
            displayName = userInfo.displayName || userInfo.name;
        }
    } else {
        const searchData = await fetchRobloxGet(`https://users.roblox.com/v1/users/search?keyword=${encodeURIComponent(rawQuery)}&limit=10`);
        if (searchData && searchData.data && searchData.data.length > 0) {
            const lower = rawQuery.toLowerCase();
            const found = searchData.data.find(u => (u.name || '').toLowerCase() === lower || (u.displayName || '').toLowerCase() === lower) || searchData.data[0];
            userId = found.id;
            realName = found.name;
            displayName = found.displayName || found.name;
        }
    }

    if (userId) {
        const thumbData = await fetchRobloxGet(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=150x150&format=Png&isCircular=false`);
        if (thumbData && thumbData.data && thumbData.data.length > 0) avatarUrl = thumbData.data[0].imageUrl || '';
    }

    savedUser = { 
        id: userId, 
        name: realName, 
        displayName: displayName, 
        avatar: avatarUrl,
        customAvatar: oldCustomAvatar 
    };
    
    localStorage.setItem('robloxUserProfile', JSON.stringify(savedUser));
    renderProfile();
}

function logoutUser() {
    savedUser = null;
    localStorage.removeItem('robloxUserProfile');
    renderProfile();
}

async function fetchGamesFromRoblox(reset = false) {
    if (isLoading) return;
    isLoading = true;
    
    const loader = document.getElementById('loader');
    if (loader) loader.style.display = 'block';

    const sessionId = crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
    });

    let url = `https://apis.roblox.com/explore-api/v1/get-sort-content?urlLocale=en_us&device=computer&country=all&sessionId=${sessionId}&sortId=${currentSortId}`;
    if (!reset && nextPageToken) url += `&pageToken=${nextPageToken}`;

    const data = await fetchRobloxGet(url);

    if (data && data.games) {
        if (reset) {
            discoverGames = [];
            nextPageToken = null;
        }

        const newGames = data.games.map(g => ({
            id: String(g.rootPlaceId || g.placeId || g.id || ''),
            universeId: String(g.universeId || g.id || ''),
            name: g.name || 'Unknown',
            playing: g.playerCount ? `${Number(g.playerCount).toLocaleString('en-US')} playing` : 'Roblox',
            c1: '#1e40af', c2: '#0f172a', img: ''
        })).filter(g => g.id && g.universeId);

        const existingIds = new Set(discoverGames.map(g => g.id));
        const uniqueNewGames = newGames.filter(g => !existingIds.has(g.id));

        discoverGames.push(...uniqueNewGames);
        nextPageToken = data.nextPageToken || null;

        if (uniqueNewGames.length === 0 && nextPageToken) {
            isLoading = false;
            if (loader) loader.style.display = 'none';
            return fetchGamesFromRoblox(); 
        }

        if (!nextPageToken) {
            if (loader) loader.innerHTML = '🎉 That is all games for today!';
            setTimeout(() => { if (loader) loader.style.display = 'none'; }, 2000);
        }

        if (currentTab !== 'friends') renderGames();
        
        if (uniqueNewGames.length > 0) {
            loadThumbnailsForNewGames(uniqueNewGames);
        }
    } else {
        if (loader) loader.textContent = '⚠️ Loading error. Check internet.';
    }

    isLoading = false;
    if (loader && nextPageToken) loader.style.display = 'none';
}

async function loadThumbnailsForNewGames(games) {
    const uids = games.map(g => g.universeId).join(',');
    if (!uids) return;

    const thumbData = await fetchRobloxGet(`https://thumbnails.roblox.com/v1/games/multiget/thumbnails?universeIds=${uids}&size=768x432&format=Png&isCircular=false`);
    if (thumbData && thumbData.data) {
        const map = {};
        thumbData.data.forEach(t => {
            const uid = String(t.targetId || t.universeId || '');
            if (t.thumbnails && t.thumbnails.length > 0) map[uid] = t.thumbnails[0].imageUrl;
        });

        discoverGames.forEach(g => { if (map[g.universeId]) g.img = map[g.universeId]; });
        if (currentTab !== 'friends') renderGames();
    }
}

function renderGames() {
    if (currentTab === 'friends') return renderFriends();

    const grid = document.getElementById('gamesGrid');
    if (!grid) return;
    
    const oldHeight = document.documentElement.scrollHeight;
    const filterText = document.getElementById('searchInput').value.toLowerCase();
    grid.innerHTML = '';
    
    let list = currentTab === 'discover' ? discoverGames : myGames;
    
    if (currentTab === 'discover' && !filterText && list.length > MAX_VISIBLE_GAMES) {
        list = list.slice(list.length - MAX_VISIBLE_GAMES);
    }

    if (list.length === 0 && !isLoading) {
        grid.innerHTML = '<div style="grid-column:1/-1;padding:20px;color:#93c5fd;">Empty for now...</div>';
        return;
    }

    list.forEach((game) => {
        if (filterText && !game.name.toLowerCase().includes(filterText) && !String(game.id).includes(filterText)) return;

        const topRightBtn = currentTab === 'my' 
            ? `<button class="del-btn" onclick="removeGame('${game.id}')">✕</button>` 
            : `<button class="fav-btn" onclick="saveToMy('${game.id}')">★ Add to Favorites</button>`;
            
        const poster = makePoster(game.name, game.c1 || '#1e40af', game.c2 || '#0f172a');
        const imgSrc = game.img ? game.img : poster;
        
        grid.innerHTML += `<div class="card">
            <div class="thumb-wrap">
                <span class="badge-online">● ${escapeHTML(game.playing || 'Roblox')}</span>
                ${topRightBtn}
                <img class="thumb" src="${imgSrc}" onerror="this.onerror=null; this.src='${poster}';" alt="${escapeHTML(game.name)}">
            </div>
            <div class="card-body">
                <div class="title" title="${escapeHTML(game.name)}">${escapeHTML(game.name)}</div>
                <a href="roblox://experiences/start?placeId=${game.id}" class="play-btn">▶ PLAY</a>
            </div>
        </div>`;
    });

    const newHeight = document.documentElement.scrollHeight;
    if (newHeight < oldHeight) {
        window.scrollBy(0, newHeight - oldHeight); 
    }
}

function renderFriends() {
    const grid = document.getElementById('gamesGrid');
    grid.innerHTML = '';
    
    if (myFriends.length === 0) {
        grid.innerHTML = '<div style="grid-column:1/-1;padding:20px;color:#93c5fd;text-align:center;">No friends yet. Use the search bar above to find and add them!</div>';
        return;
    }

    myFriends.forEach(friend => {
        grid.innerHTML += `<div class="friend-card" onclick="showProfile('${friend.id}')">
            <img class="friend-avatar" src="${friend.avatar || makePoster(friend.name, '#3b82f6', '#1d4ed8')}" alt="${escapeHTML(friend.name)}">
            <div class="friend-name">${escapeHTML(friend.displayName || friend.name)}</div>
            <div class="friend-username">@${escapeHTML(friend.name)}</div>
        </div>`;
    });
}

async function addFriendByUsername() {
    const input = document.getElementById('friendSearchInput');
    const status = document.getElementById('friendStatus');
    const rawQuery = input.value.replace('@', '').trim();
    if (!rawQuery) return;

    status.textContent = 'Searching...';
    let userId = '', realName = '', displayName = '', avatarUrl = '';

    if (/^\d+$/.test(rawQuery)) {
        userId = rawQuery;
        const userInfo = await fetchRobloxGet(`https://users.roblox.com/v1/users/${userId}`);
        if (userInfo && userInfo.name) {
            realName = userInfo.name;
            displayName = userInfo.displayName || userInfo.name;
        }
    } else {
        const searchData = await fetchRobloxGet(`https://users.roblox.com/v1/users/search?keyword=${encodeURIComponent(rawQuery)}&limit=10`);
        if (searchData && searchData.data && searchData.data.length > 0) {
            const found = searchData.data[0];
            userId = found.id;
            realName = found.name;
            displayName = found.displayName || found.name;
        }
    }

    if (!userId) {
        status.textContent = 'User not found!';
        setTimeout(() => status.textContent = '', 3000);
        return;
    }

    if (myFriends.some(f => f.id === userId)) {
        status.textContent = 'Already in friends list!';
        setTimeout(() => status.textContent = '', 3000);
        return;
    }

    const thumbData = await fetchRobloxGet(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=150x150&format=Png&isCircular=false`);
    if (thumbData && thumbData.data && thumbData.data.length > 0) {
        avatarUrl = thumbData.data[0].imageUrl || '';
    }

    myFriends.unshift({ 
        id: userId, 
        name: realName, 
        displayName: displayName, 
        avatar: avatarUrl 
    });
    
    localStorage.setItem('myRobloxFriends', JSON.stringify(myFriends));
    input.value = '';
    status.textContent = 'Friend added!';
    setTimeout(() => status.textContent = '', 3000);
    renderFriends();
}

let currentProfileId = null;

async function showProfile(userId) {
    const friend = myFriends.find(f => f.id === userId);
    if (!friend) return;

    currentProfileId = userId;
    const modal = document.getElementById('profileModal');
    modal.style.display = 'flex';

    document.getElementById('modalAvatar').src = friend.avatar || makePoster(friend.name, '#3b82f6', '#1d4ed8');
    document.getElementById('modalDisplayName').textContent = friend.displayName || friend.name;
    document.getElementById('modalUsername').textContent = '@' + friend.name;
    document.getElementById('modalId').textContent = userId;
    document.getElementById('modalJoined').textContent = 'Loading...';
    document.getElementById('modalDesc').textContent = 'Loading description...';

    const data = await fetchRobloxGet(`https://users.roblox.com/v1/users/${userId}`);
    if (data) {
        if (data.created) {
            const date = new Date(data.created);
            document.getElementById('modalJoined').textContent = date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        } else {
            document.getElementById('modalJoined').textContent = 'Unknown';
        }
        
        document.getElementById('modalDesc').textContent = data.description || 'No description provided.';
    } else {
        document.getElementById('modalJoined').textContent = 'Private';
        document.getElementById('modalDesc').textContent = 'Unable to load description.';
    }
}

function closeModal(event) {
    if (event.target.id === 'profileModal') {
        closeProfile();
    }
}

function closeProfile() {
    document.getElementById('profileModal').style.display = 'none';
    currentProfileId = null;
}

function removeFriendFromModal() {
    if (!currentProfileId) return;
    myFriends = myFriends.filter(f => f.id !== currentProfileId);
    localStorage.setItem('myRobloxFriends', JSON.stringify(myFriends));
    closeProfile();
    renderFriends();
}

function saveToMy(id) {
    const game = discoverGames.find(g => g.id === id);
    if (!game) return;
    if (!myGames.some(g => g.id === id)) {
        myGames.unshift(game);
        localStorage.setItem('myRobloxGames', JSON.stringify(myGames));
    }
    document.getElementById('status').textContent = `"${game.name}" added!`;
    setTimeout(() => document.getElementById('status').textContent = '', 2000);
}

function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tabDiscover').classList.toggle('active', tab === 'discover');
    document.getElementById('tabMy').classList.toggle('active', tab === 'my');
    document.getElementById('tabFriends').classList.toggle('active', tab === 'friends');
    
    const mainBar = document.getElementById('mainControlBar');
    const friendBar = document.getElementById('friendControlBar');
    const loader = document.getElementById('loader');

    if (tab === 'friends') {
        mainBar.style.display = 'none';
        friendBar.style.display = 'flex';
        loader.style.display = 'none';
        renderFriends();
    } else {
        mainBar.style.display = 'flex';
        friendBar.style.display = 'none';
        renderGames();
    }
}

async function addGameById() {
    const input = document.getElementById('searchInput');
    const status = document.getElementById('status');
    const match = input.value.match(/\d+/);
    
    if (!match) {
        status.textContent = 'Paste Game ID!';
        return;
    }
    
    const placeId = match[0];
    status.textContent = 'Searching...';
    let gameName = '', imgUrl = '', gamePlaying = '', uid = '';

    const uData = await fetchRobloxGet(`https://apis.roblox.com/universes/v1/places/${placeId}/universe`);
    if (uData && uData.universeId) {
        uid = uData.universeId;
        const [infoData, thumbData] = await Promise.all([
            fetchRobloxGet(`https://games.roblox.com/v1/games?universeIds=${uid}`),
            fetchRobloxGet(`https://thumbnails.roblox.com/v1/games/multiget/thumbnails?universeIds=${uid}&size=768x432&format=Png&isCircular=false`)
        ]);
        
        if (infoData && infoData.data && infoData.data.length > 0) {
            gameName = infoData.data[0].name;
            gamePlaying = Number(infoData.data[0].playing).toLocaleString('en-US') + ' playing';
        }
        
        if (thumbData && thumbData.data && thumbData.data.length > 0 && thumbData.data[0].thumbnails && thumbData.data[0].thumbnails.length > 0) {
            imgUrl = thumbData.data[0].thumbnails[0].imageUrl;
        }
    }

    if (!gameName) {
        status.textContent = '';
        gameName = prompt('Enter a name for the game (ID: ' + placeId + '):', 'My game #' + placeId);
        if (!gameName) return;
        gamePlaying = 'ID: ' + placeId;
    }

    myGames.unshift({ 
        id: placeId, 
        universeId: uid, 
        name: gameName, 
        playing: gamePlaying,
        c1: '#1e40af', 
        c2: '#0f172a', 
        img: imgUrl 
    });
    
    localStorage.setItem('myRobloxGames', JSON.stringify(myGames));
    input.value = '';
    status.textContent = 'Added!';
    switchTab('my');
    setTimeout(() => status.textContent = '', 2000);
}

function removeGame(id) {
    myGames = myGames.filter(g => g.id !== id);
    localStorage.setItem('myRobloxGames', JSON.stringify(myGames));
    renderGames();
}

window.addEventListener('scroll', () => {
    if (currentTab !== 'discover' || isLoading || !nextPageToken) return;
    if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 600) {
        fetchGamesFromRoblox();
    }
});

async function updateOnlineCounts() {
    if (currentTab === 'friends') return;
    
    const allGames = [...discoverGames, ...myGames];
    const uniqueUniverseIds = [...new Set(allGames.map(g => g.universeId).filter(id => id))];

    if (uniqueUniverseIds.length === 0) return;

    const chunkSize = 50;
    for (let i = 0; i < uniqueUniverseIds.length; i += chunkSize) {
        const chunk = uniqueUniverseIds.slice(i, i + chunkSize).join(',');
        const data = await fetchRobloxGet(`https://games.roblox.com/v1/games?universeIds=${chunk}`);
        
        if (data && data.data) {
            const infoMap = {};
            data.data.forEach(item => {
                infoMap[item.id] = item.playing;
            });

            allGames.forEach(g => {
                if (g.universeId && infoMap[g.universeId] !== undefined) {
                    g.playing = Number(infoMap[g.universeId]).toLocaleString('en-US') + ' playing';
                }
            });
        }
    }
    renderGames();
}

setInterval(updateOnlineCounts, 60000);

renderProfile();
renderGames();
fetchGamesFromRoblox(true);
</script>
