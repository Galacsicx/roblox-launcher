<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой Roblox Launcher</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body {
            margin: 0;
            background: linear-gradient(135deg, #1b3b6f 0%, #0d1b36 100%);
            color: white;
            min-height: 100vh;
            padding: 30px;
        }
        .container { max-width: 1120px; margin: 0 auto; }

        /* Шапка */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            background: rgba(10, 22, 46, 0.7);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid #2e5699;
        }
        .left-header { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        .tabs { display: flex; gap: 8px; }
        .tab-btn {
            background: #13294d;
            border: 1px solid #3562ad;
            color: #b8d0fa;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .tab-btn.active {
            background: #3b82f6;
            color: white;
            border-color: #60a5fa;
        }

        /* Профиль */
        .profile-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #13294d;
            padding: 7px 14px;
            border-radius: 8px;
            border: 1px solid #3b6ec2;
        }
        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #0a1529;
            object-fit: cover;
            border: 2px solid #4ade80;
            flex-shrink: 0;
        }
        .username-text { font-weight: bold; font-size: 15px; color: #ffffff; }
        .user-sub { font-size: 11px; color: #4ade80; }
        .login-input {
            background: #0d1b36;
            border: 1px solid #3b6ec2;
            color: white;
            padding: 7px 10px;
            border-radius: 5px;
            font-size: 13px;
            width: 175px;
            outline: none;
        }
        .small-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .small-btn:hover { background: #2563eb; }
        .logout-btn {
            background: transparent;
            border: 1px solid #ef4444;
            color: #f87171;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            margin-left: 4px;
        }

        /* Панель поиска и добавления */
        .control-bar {
            background: rgba(10, 22, 46, 0.75);
            border: 1px solid #2e5699;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-input {
            background: #13294d;
            border: 1px solid #3b6ec2;
            color: white;
            padding: 10px 14px;
            border-radius: 5px;
            font-size: 14px;
            outline: none;
            min-width: 270px;
        }
        .add-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .add-btn:hover { background: #2563eb; }

        /* Сетка игр */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 18px;
        }
        .card {
            background: #122647;
            border: 1px solid #264882;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.45); }
        .thumb-wrap { position: relative; height: 135px; background: #0a1529; overflow: hidden; }
        .thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
        .badge-online {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.78);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: #4ade80;
            font-weight: bold;
            z-index: 2;
        }
        .del-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0,0,0,0.78);
            color: #ff6b6b;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            padding: 3px 8px;
            font-weight: bold;
            z-index: 2;
        }
        .fav-btn {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0,0,0,0.78);
            color: #facc15;
            border: 1px solid #facc15;
            border-radius: 4px;
            cursor: pointer;
            padding: 2px 7px;
            font-size: 12px;
            z-index: 2;
        }
        .card-body { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .title { font-weight: bold; font-size: 15px; margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .play-btn {
            display: block;
            text-align: center;
            background: #f5d142;
            color: #141024;
            text-decoration: none;
            font-weight: bold;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        .play-btn:hover { background: #ffe066; }
        .loader { color: #93c5fd; font-size: 15px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div class="left-header">
            <h2 style="margin:0;">Roblox Launcher</h2>
            <div class="tabs">
                <button class="tab-btn active" id="tabDiscover" onclick="switchTab('discover')">🔥 Популярные игры</button>
                <button class="tab-btn" id="tabMy" onclick="switchTab('my')">⭐ Мои игры</button>
            </div>
        </div>

        <div class="profile-box" id="profileBox"></div>
    </div>

    <div class="control-bar">
        <input type="text" class="search-input" id="searchInput" placeholder="Поиск по названию или вставь ID игры..." onkeyup="renderGames()">
        <button class="add-btn" onclick="addGameById()">+ Добавить игру по ID</button>
        <span id="status" style="color: #93c5fd; font-size: 13px;"></span>
    </div>

    <div id="loader" class="loader">Загружаю свежие обложки и онлайн из Roblox...</div>
    <div class="games-grid" id="gamesGrid"></div>
</div>

<script>
    // Прокси для картинок Roblox (чтобы открывались в РФ в обход блокировки ://rbxcdn.com)
    function proxyImg(url) {
        if (!url) return '';
        if (url.startsWith('https://wsrv.nl')) return url;
        return 'https://wsrv.nl?url=' + encodeURIComponent(url);
    }

    // Надёжный GET-запрос к API Roblox через 3 резервных прокси
    async function fetchRobloxGet(url) {
        const proxies = [
            'https://corsproxy.io?' + encodeURIComponent(url),
            'https://allorigins.win' + encodeURIComponent(url),
            url.replace('roblox.com', 'roproxy.com')
        ];

        for (const pUrl of proxies) {
            try {
                const res = await fetch(pUrl);
                if (res.ok) {
                    const data = await res.json();
                    if (data && !data.errors) return data;
                }
            } catch (e) {}
        }
        return null;
    }

    // --- 1. СТРОГИЙ ВХОД ПО НИКУ С НАСТОЯЩЕЙ АВАТАРКОЙ ---
    let savedUser = JSON.parse(localStorage.getItem('robloxUserProfile')) || null;

    function renderProfile() {
        const box = document.getElementById('profileBox');
        if (savedUser) {
            box.innerHTML = `
                <img class="avatar" src="${proxyImg(savedUser.avatar)}" alt="Avatar">
                <div>
                    <div class="username-text">${savedUser.displayName} <span style="color:#93c5fd; font-weight:normal; font-size:12px;">(@${savedUser.name})</span></div>
                    <div class="user-sub">● ID: ${savedUser.id}</div>
                </div>
                <button class="logout-btn" onclick="logoutUser()">Выйти</button>
            `;
        } else {
            box.innerHTML = `
                <input type="text" class="login-input" id="usernameInput" placeholder="Ник или Display Name" onkeydown="if(event.key==='Enter') loginUser()">
                <button class="small-btn" onclick="loginUser()">Войти</button>
            `;
        }
    }

    async function loginUser() {
        const input = document.getElementById('usernameInput');
        const rawQuery = input.value.replace('@', '').trim();
        if (!rawQuery) return;

        input.disabled = true;
        input.value = 'Ищу в Roblox...';

        // Ищем реального игрока в базе Roblox по @username или Display Name
        const searchData = await fetchRobloxGet(`https://roblox.com{encodeURIComponent(rawQuery)}&limit=10`);

        if (!searchData || !searchData.data || searchData.data.length === 0) {
            alert('Ошибка: игрок «' + rawQuery + '» не найден в базе Roblox!');
            input.disabled = false;
            input.value = rawQuery;
            return;
        }

        // Ищем точное совпадение по username или displayName
        const lower = rawQuery.toLowerCase();
        const exactUser = searchData.data.find(u => u.name.toLowerCase() === lower || u.displayName.toLowerCase() === lower);

        if (!exactUser) {
            alert('Точного совпадения для «' + rawQuery + '» не найдено! Проверь правильность ника.');
            input.disabled = false;
            input.value = rawQuery;
            return;
        }

        // Загружаем настоящую 3D-аватарку головы персонажа
        const thumbData = await fetchRobloxGet(`https://roblox.com{exactUser.id}&size=150x150&format=Png&isCircular=false`);
        let avatarUrl = '';
        if (thumbData && thumbData.data && thumbData.data.length > 0) {
            avatarUrl = thumbData.data.at(0).imageUrl;
        }

        savedUser = {
            id: exactUser.id,
            name: exactUser.name,
            displayName: exactUser.displayName,
            avatar: avatarUrl
        };

        localStorage.setItem('robloxUserProfile', JSON.stringify(savedUser));
        renderProfile();
    }

    function logoutUser() {
        savedUser = null;
        localStorage.removeItem('robloxUserProfile');
        renderProfile();
    }

    // --- 2. ЗАГРУЗКА ИГР И СВЕЖИХ ОБЛОЖЕК ИЗ ROBLOX ---
    const popularPlaceIds = [
        '2753915549', // Blox Fruits
        '4924922222', // Brookhaven
        '189707',     // Natural Disaster Survival
        '920587237',  // Adopt Me
        '142823291',  // Murder Mystery 2
        '6516141723', // DOORS
        '286090429',  // Arsenal
        '13772394625',// Blade Ball
        '155615604',  // Prison Life
        '6872265039', // BedWars
        '537413528',  // Build A Boat For Treasure
        '3956818381'  // Ninja Legends
    ];

    let currentTab = 'discover';
    let discoverGames = [];
    let myGames = JSON.parse(localStorage.getItem('myRobloxGames')) || [];

    async function fetchGamesDetails(placeIds) {
        const results = [];
        const universeMap = {};

        await Promise.all(placeIds.map(async (pid) => {
            const uData = await fetchRobloxGet(`https://roblox.com{pid}/universe`);
            if (uData && uData.universeId) {
                universeMap[pid] = uData.universeId;
            }
        }));

        const universeIds = Object.values(universeMap);
        if (universeIds.length === 0) return [];

        const uidsStr = universeIds.join(',');

        const [infoData, thumbData] = await Promise.all([
            fetchRobloxGet(`https://roblox.com{uidsStr}`),
            fetchRobloxGet(`https://roblox.com{uidsStr}&size=768x432&format=Png&isCircular=false`)
        ]);

        const infoMap = {};
        if (infoData && infoData.data) {
            infoData.data.forEach(g => { infoMap[g.id] = g; });
        }

        const thumbMap = {};
        if (thumbData && thumbData.data) {
            thumbData.data.forEach(t => {
                if (t.thumbnails && t.thumbnails.length > 0) {
                    thumbMap[t.universeId] = t.thumbnails.at(0).imageUrl;
                }
            });
        }

        for (const pid of placeIds) {
            const uid = universeMap[pid];
            if (uid && infoMap[uid]) {
                results.push({
                    id: pid,
                    name: infoMap[uid].name,
                    playing: (infoMap[uid].playing || 0).toLocaleString('ru-RU') + ' в игре',
                    img: thumbMap[uid] || ''
                });
            }
        }
        return results;
    }

    async function init() {
        renderProfile();
        const loader = document.getElementById('loader');
        discoverGames = await fetchGamesDetails(popularPlaceIds);
        if (discoverGames.length > 0) {
            loader.style.display = 'none';
        } else {
            loader.textContent = 'Не удалось загрузить каталог Roblox. Нажми Ctrl + F5.';
        }
        renderGames();
    }

    function renderGames() {
        const grid = document.getElementById('gamesGrid');
        const filterText = document.getElementById('searchInput').value.toLowerCase();
        grid.innerHTML = '';

        const list = currentTab === 'discover' ? discoverGames : myGames;

        if (list.length === 0 && currentTab === 'my') {
            grid.innerHTML = '<p style="color:#93c5fd;">Пока пусто. Нажми «★ В мои» на любой игре или вставь ID игры сверху!</p>';
            return;
        }

        list.forEach((game, index) => {
            if (filterText && !game.name.toLowerCase().includes(filterText) && !String(game.id).includes(filterText)) {
                return;
            }

            const topRightBtn = currentTab === 'my'
                ? `<button class="del-btn" onclick="removeGame(${index})" title="Удалить">✕</button>`
                : `<button class="fav-btn" onclick="saveToMy(${index})">★ В мои</button>`;

            grid.innerHTML += `
                <div class="card">
                    <div class="thumb-wrap">
                        <span class="badge-online">● ${game.playing || 'Roblox'}</span>
                        ${topRightBtn}
                        <img class="thumb" src="${proxyImg(game.img)}" alt="${game.name}">
                    </div>
                    <div class="card-body">
                        <div class="title" title="${game.name}">${game.name}</div>
                        <a href="roblox://experiences/start?placeId=${game.id}" class="play-btn">▶ PLAY</a>
                    </div>
                </div>
            `;
        });
    }

    function saveToMy(index) {
        const game = discoverGames.at(index);
        if (!myGames.some(g => g.id === game.id)) {
            myGames.unshift(game);
            localStorage.setItem('myRobloxGames', JSON.stringify(myGames));
        }
        const status = document.getElementById('status');
        status.textContent = `«${game.name}» добавлена в Мои игры!`;
        setTimeout(() => status.textContent = '', 2000);
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tabDiscover').classList.toggle('active', tab === 'discover');
        document.getElementById('tabMy').classList.toggle('active', tab === 'my');
        renderGames();
    }

    async function addGameById() {
        const input = document.getElementById('searchInput');
        const status = document.getElementById('status');
        const match = input.value.match(/\d+/);
        if (!match) {
            status.textContent = 'Вставь ID или ссылку на игру!';
            return;
        }
        const placeId = match.at(0);
        status.textContent = 'Ищу игру в Roblox...';

        const loaded = await fetchGamesDetails([placeId]);
        if (loaded.length > 0) {
            myGames.unshift(loaded.at(0));
            localStorage.setItem('myRobloxGames', JSON.stringify(myGames));
            input.value = '';
            status.textContent = 'Добавлено!';
            switchTab('my');
            setTimeout(() => status.textContent = '', 2000);
        } else {
            status.textContent = 'Игра с таким ID не найдена.';
        }
    }

    function removeGame(index) {
        myGames.splice(index, 1);
        localStorage.setItem('myRobloxGames', JSON.stringify(myGames));
        renderGames();
    }

    init();
</script>

</body>
</html>
