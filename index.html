<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой Roblox Launcher</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body {
            margin: 0;
            background: linear-gradient(135deg, #1b3b6f 0%, #0d1b36 100%);
            color: white;
            min-height: 100vh;
            padding: 30px;
        }
        .container { max-width: 1100px; margin: 0 auto; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            background: rgba(10, 22, 46, 0.6);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid #2e5699;
        }
        .left-header { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        .tabs { display: flex; gap: 8px; }
        .tab-btn {
            background: #13294d;
            border: 1px solid #3562ad;
            color: #b8d0fa;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .tab-btn.active {
            background: #3b82f6;
            color: white;
            border-color: #60a5fa;
        }

        .profile-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #13294d;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #3b6ec2;
        }
        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #0a1529;
            object-fit: cover;
            border: 2px solid #4ade80;
        }
        .username-text { font-weight: bold; font-size: 15px; color: #ffffff; }
        .user-sub { font-size: 11px; color: #4ade80; }
        .login-input {
            background: #0d1b36;
            border: 1px solid #3b6ec2;
            color: white;
            padding: 6px 10px;
            border-radius: 5px;
            font-size: 13px;
            width: 160px;
            outline: none;
        }
        .small-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .logout-btn {
            background: transparent;
            border: 1px solid #ef4444;
            color: #f87171;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            margin-left: 5px;
        }

        .control-bar {
            background: rgba(10, 22, 46, 0.75);
            border: 1px solid #2e5699;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-input {
            background: #13294d;
            border: 1px solid #3b6ec2;
            color: white;
            padding: 10px 14px;
            border-radius: 5px;
            font-size: 14px;
            outline: none;
            min-width: 260px;
        }
        .add-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        .add-btn:hover { background: #2563eb; }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
        }
        .card {
            background: #122647;
            border: 1px solid #264882;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .thumb-wrap { position: relative; height: 135px; background: #0a1529; }
        .thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
        .badge-online {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.75);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: #4ade80;
            font-weight: bold;
        }
        .del-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0,0,0,0.75);
            color: #ff6b6b;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            padding: 3px 7px;
            font-weight: bold;
        }
        .card-body { padding: 12px; }
        .title { font-weight: bold; font-size: 15px; margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .play-btn {
            display: block;
            text-align: center;
            background: #f5d142;
            color: #141024;
            text-decoration: none;
            font-weight: bold;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        .play-btn:hover { background: #ffe066; }
        .loader { color: #93c5fd; font-size: 15px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div class="left-header">
            <h2 style="margin:0;">Roblox Launcher</h2>
            <div class="tabs">
                <button class="tab-btn active" id="tabDiscover" onclick="switchTab('discover')">🔥 Популярные</button>
                <button class="tab-btn" id="tabMy" onclick="switchTab('my')">⭐ Мои игры</button>
            </div>
        </div>

        <div class="profile-box" id="profileBox"></div>
    </div>

    <div class="control-bar">
        <input type="text" class="search-input" id="searchInput" placeholder="Поиск или вставь ID игры..." onkeyup="renderGames()">
        <button class="add-btn" onclick="addGameById()">+ Добавить игру по ID</button>
        <span id="status" style="color: #93c5fd; font-size: 13px;"></span>
    </div>

    <div id="loader" class="loader">Загружаю игры из Roblox...</div>
    <div class="games-grid" id="gamesGrid"></div>
</div>

<script>
    async function fetchRoblox(url, options = {}) {
        try {
            const r1 = await fetch('https://corsproxy.io?' + encodeURIComponent(url), options);
            if (r1.ok) return await r1.json();
        } catch (e) {}
        
        const proxyUrl = url.replace('roblox.com', 'roproxy.com');
        const r2 = await fetch(proxyUrl, options);
        return await r2.json();
    }

    let savedUser = JSON.parse(localStorage.getItem('robloxUserProfile')) || null;

    function renderProfile() {
        const box = document.getElementById('profileBox');
        if (savedUser) {
            box.innerHTML = `
                <img class="avatar" src="${savedUser.avatar}" alt="Avatar">
                <div>
                    <div class="username-text">@${savedUser.name} <span style="color:#93c5fd; font-weight:normal; font-size:12px;">(${savedUser.displayName})</span></div>
                    <div class="user-sub">● Зарегистрирован (ID: ${savedUser.id})</div>
                </div>
                <button class="logout-btn" onclick="logoutUser()">Сменить</button>
            `;
        } else {
            box.innerHTML = `
                <input type="text" class="login-input" id="usernameInput" placeholder="Введи @username">
                <button class="small-btn" onclick="loginUser()">Войти</button>
            `;
        }
    }

    async function loginUser() {
        const input = document.getElementById('usernameInput');
        const username = input.value.replace('@', '').trim();
        if (!username) return;

        input.disabled = true;
        input.value = 'Проверяю...';

        try {
            const res = await fetchRoblox('https://roblox.com', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usernames: [username], excludeBannedUsers: false })
            });

            if (!res.data || res.data.length === 0) {
                alert('Игрок с таким @username не зарегистрирован в Roblox!');
                input.disabled = false;
                input.value = username;
                return;
            }

            const user = res.data.at(0);
            const thumbRes = await fetchRoblox(`https://roblox.com{user.id}&size=150x150&format=Png&isCircular=false`);
            const avatarUrl = (thumbRes.data && thumbRes.data.length > 0) ? thumbRes.data.at(0).imageUrl : '';

            savedUser = {
                id: user.id,
                name: user.name,
                displayName: user.displayName,
                avatar: avatarUrl
            };

            localStorage.setItem('robloxUserProfile', JSON.stringify(savedUser));
            renderProfile();
        } catch (e) {
            alert('Не удалось связаться с базой Roblox. Проверь интернет.');
            input.disabled = false;
            input.value = username;
        }
    }

    function logoutUser() {
        savedUser = null;
        localStorage.removeItem('robloxUserProfile');
        renderProfile();
    }

    const popularPlaceIds = [
        '2753915549', '4924922222', '189707', '920587237',
        '142823291', '155615604', '286090429', '6516141723',
        '13772394625', '3956818381', '6872265039', '537413528'
    ];

    let currentTab = 'discover';
    let discoverGames = [];
    let myGames = JSON.parse(localStorage.getItem('myRobloxGames')) || [];

    async function fetchGamesDetails(placeIds) {
        const results = [];
        const universeMap = {};

        await Promise.all(placeIds.map(async (pid) => {
            try {
                const uData = await fetchRoblox(`https://roblox.com{pid}/universe`);
                if (uData && uData.universeId) universeMap[pid] = uData.universeId;
            } catch (e) {}
        }));

        const universeIds = Object.values(universeMap);
        if (universeIds.length === 0) return [];

        const uidsStr = universeIds.join(',');

        const infoData = await fetchRoblox(`https://roblox.com{uidsStr}`);
        const infoMap = {};
        (infoData.data || []).forEach(g => { infoMap[g.id] = g; });

        const thumbData = await fetchRoblox(`https://roblox.com{uidsStr}&size=768x432&format=Png&isCircular=false`);
        const thumbMap = {};
        (thumbData.data || []).forEach(t => {
            if (t.thumbnails && t.thumbnails.length > 0) {
                thumbMap[t.universeId] = t.thumbnails.at(0).imageUrl;
            }
        });

        for (const pid of placeIds) {
            const uid = universeMap[pid];
            if (uid && infoMap[uid]) {
                results.push({
                    id: pid,
                    name: infoMap[uid].name,
                    playing: (infoMap[uid].playing || 0).toLocaleString('ru-RU') + ' в игре',
                    img: thumbMap[uid] || ''
                });
            }
        }
        return results;
    }

    async function init() {
        renderProfile();
        const loader = document.getElementById('loader');
        discoverGames = await fetchGamesDetails(popularPlaceIds);
        if (discoverGames.length > 0) {
            loader.style.display = 'none';
        } else {
            loader.textContent = 'Не удалось загрузить каталог Roblox (нажми F5).';
        }
        renderGames();
    }

    function renderGames() {
        const grid = document.getElementById('gamesGrid');
        const filterText = document.getElementById('searchInput').value.toLowerCase();
        grid.innerHTML = '';

        const list = currentTab === 'discover' ? discoverGames : myGames;

        list.forEach((game, index) => {
            if (filterText && !game.name.toLowerCase().includes(filterText) && !String(game.id).includes(filterText)) {
                return;
            }
            const delButton = currentTab === 'my' 
                ? `<button class="del-btn" onclick="removeGame(${index})" title="Удалить">✕</button>` 
                : '';

            grid.innerHTML += `
                <div class="card">
                    <div class="thumb-wrap">
                        <span class="badge-online">● ${game.playing}</span>
                        ${delButton}
                        <img class="thumb" src="${game.img}" alt="${game.name}" loading="lazy">
                    </div>
                    <div class="card-body">
                        <div class="title" title="${game.name}">${game.name}</div>
                        <a href="roblox://experiences/start?placeId=${game.id}" class="play-btn">▶ PLAY</a>
                    </div>
                </div>
            `;
        });
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tabDiscover').classList.toggle('active', tab === 'discover');
        document.getElementById('tabMy').classList.toggle('active', tab === 'my');
        renderGames();
    }

    async function addGameById() {
        const input = document.getElementById('searchInput');
        const status = document.getElementById('status');
        const match = input.value.match(/\d+/);
        if (!match) {
            status.textContent = 'Введи ID или ссылку на игру!';
            return;
        }
        const placeId = match.at(0);
        status.textContent = 'Загружаю игру...';

        const loaded = await fetchGamesDetails([placeId]);
        if (loaded.length > 0) {
            myGames.unshift(loaded.at(0));
            localStorage.setItem('myRobloxGames', JSON.stringify(myGames));
            input.value = '';
            status.textContent = 'Добавлено!';
            switchTab('my');
            setTimeout(() => status.textContent = '', 2000);
        } else {
            status.textContent = 'Не удалось найти игру по этому ID.';
        }
    }

    function removeGame(index) {
        myGames.splice(index, 1);
        localStorage.setItem('myRobloxGames', JSON.stringify(myGames));
        renderGames();
    }

    init();
</script>

</body>
</html>
