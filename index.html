<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Roblox Launcher — Все игры</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { margin: 0; background: linear-gradient(135deg, #1b3b6f, #0d1b36); color: #fff; min-height: 100vh; padding: 20px; }
        .wrap { max-width: 1120px; margin: 0 auto; }
        .bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; background: rgba(10,22,46,0.85); border: 1px solid #2e5699; padding: 14px 18px; border-radius: 10px; margin-bottom: 18px; position: sticky; top: 10px; z-index: 10; backdrop-filter: blur(8px); }
        .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        button { background: #13294d; border: 1px solid #3562ad; color: #b8d0fa; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button.active, .btn-blue { background: #3b82f6; color: #fff; border-color: #60a5fa; }
        input { background: #0d1b36; border: 1px solid #3b6ec2; color: #fff; padding: 8px 12px; border-radius: 6px; outline: none; }
        
        /* Контейнер виртуального списка (как на Sega) */
        #viewport { position: relative; width: 100%; }
        #grid { position: absolute; left: 0; right: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        @media (max-width: 950px) { #grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 700px) { #grid { grid-template-columns: repeat(2, 1fr); } }

        .card { height: 215px; background: #122647; border: 1px solid #264882; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
        .thumb { position: relative; height: 115px; background: linear-gradient(135deg, #1e3a8a, #0f172a); display: flex; align-items: center; justify-content: center; padding: 10px; text-align: center; }
        .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .thumb-title { color: rgba(255,255,255,0.45); font-weight: bold; font-size: 14px; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
        .tag { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.8); color: #4ade80; font-size: 11px; padding: 3px 7px; border-radius: 4px; font-weight: bold; z-index: 2; }
        .mini-btn { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.85); color: #facc15; border: 1px solid #facc15; padding: 2px 7px; font-size: 11px; z-index: 2; }
        .del-btn { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.85); color: #ff6b6b; border: none; padding: 2px 7px; z-index: 2; }
        .body { padding: 10px 12px; }
        .title { font-weight: bold; font-size: 14px; margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .play { display: block; text-align: center; background: #f5d142; color: #141024; text-decoration: none; font-weight: bold; padding: 8px; border-radius: 5px; font-size: 13px; }
        .play:hover { background: #ffe066; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="bar">
        <div class="row">
            <h2 style="margin:0 8px 0 0;">Roblox Launcher</h2>
            <button id="tDisc" class="active" onclick="setTab('disc')">🔥 Все игры (<span id="cnt">0</span>)</button>
            <button id="tMy" onclick="setTab('my')">⭐ Мои игры</button>
        </div>
        <div class="row">
            <input id="q" style="min-width:230px;" placeholder="Поиск игры в Roblox или ID..." onkeydown="if(event.key==='Enter')searchRoblox()" onkeyup="renderVirtual()">
            <button class="btn-blue" onclick="searchRoblox()">Найти / +ID</button>
        </div>
    </div>

    <div id="status" style="color:#93c5fd; margin-bottom:12px; font-size:13px;">Загружаю каталог игр из Roblox...</div>
    
    <!-- Виртуальное поле прокрутки -->
    <div id="viewport">
        <div id="grid"></div>
    </div>
</div>

<script>
    const H_APIS = 'https://' + '://roblox.com';
    const H_GAMES = 'https://' + '://roblox.com';
    const H_THUMB = 'https://' + '://roblox.com';

    async function api(url) {
        const list = [
            url.replace('roblox.com', 'roproxy.com'),
            'https://allorigins.win' + encodeURIComponent(url),
            'https://codetabs.com' + encodeURIComponent(url)
        ];
        for (const u of list) {
            try {
                const r = await fetch(u, { signal: AbortSignal.timeout(8000) });
                if (r.ok) {
                    const d = await r.json();
                    if (d && !d.errors) return d;
                }
            } catch {}
        }
        return null;
    }

    let tab = 'disc';
    let allGames = [];
    let myGames = JSON.parse(localStorage.getItem('rbxMy')) || [];
    const ROW_H = 231; // Высота карточки (215px) + отступ (16px)

    function getCols() {
        const w = window.innerWidth;
        if (w <= 700) return 2;
        if (w <= 950) return 3;
        return 4;
    }

    function getFiltered() {
        const f = document.getElementById('q').value.toLowerCase().trim();
        const src = tab === 'disc' ? allGames : myGames;
        if (!f) return src;
        return src.filter(g => g.name.toLowerCase().includes(f) || String(g.id).includes(f));
    }

    // Отрисовка ТОЛЬКО видимых на экране строк (принцип Sega)
    function renderVirtual() {
        const list = getFiltered();
        const cols = getCols();
        const totalRows = Math.ceil(list.length / cols);
        
        const vp = document.getElementById('viewport');
        const grid = document.getElementById('grid');
        vp.style.height = (totalRows * ROW_H) + 'px';

        if (list.length === 0) {
            grid.style.top = '0px';
            grid.innerHTML = '<p style="color:#93c5fd; grid-column:1/-1;">Ничего не найдено. Нажми «Найти / +ID», чтобы поискать в базе Roblox!</p>';
            return;
        }

        const scrollY = Math.max(0, window.scrollY - vp.offsetTop);
        const startRow = Math.max(0, Math.floor(scrollY / ROW_H) - 1);
        const visibleRows = Math.ceil(window.innerHeight / ROW_H) + 3;
        const endRow = Math.min(totalRows, startRow + visibleRows);

        grid.style.top = (startRow * ROW_H) + 'px';

        const slice = list.slice(startRow * cols, endRow * cols);
        grid.innerHTML = slice.map((g, idx) => {
            const realIndex = startRow * cols + idx;
            const imgHtml = g.img ? '<img src="' + g.img + '" loading="lazy" onerror="this.remove()">' : '';
            const btnHtml = tab === 'my'
                ? '<button class="del-btn" onclick="delMy(' + realIndex + ')">✕</button>'
                : '<button class="mini-btn" onclick="addMy(' + realIndex + ')">★ В мои</button>';

            return '<div class="card">' +
                '<div class="thumb">' +
                    '<span class="thumb-title">' + g.name + '</span>' +
                    '<span class="tag">● ' + (g.tag || 'Roblox') + '</span>' +
                    btnHtml + imgHtml +
                '</div>' +
                '<div class="body">' +
                    '<div class="title" title="' + g.name + '">' + g.name + '</div>' +
                    '<a class="play" href="roblox://experiences/start?placeId=' + g.id + '">▶ PLAY</a>' +
                '</div>' +
            '</div>';
        }).join('');
    }

    function setTab(t) {
        tab = t;
        document.getElementById('tDisc').className = t === 'disc' ? 'active' : '';
        document.getElementById('tMy').className = t === 'my' ? 'active' : '';
        window.scrollTo(0, 0);
        renderVirtual();
    }

    function addMy(idx) {
        const g = getFiltered().at(idx);
        if (g && !myGames.some(x => x.id == g.id)) {
            myGames.unshift({ ...g });
            localStorage.setItem('rbxMy', JSON.stringify(myGames));
        }
        document.getElementById('status').textContent = '«' + g.name + '» добавлена в Мои игры!';
    }

    function delMy(idx) {
        const g = getFiltered().at(idx);
        myGames = myGames.filter(x => x.id != g.id);
        localStorage.setItem('rbxMy', JSON.stringify(myGames));
        renderVirtual();
    }

    // Загрузка всех основных категорий игр из Roblox
    async function loadAllRobloxGames() {
        const status = document.getElementById('status');
        const sorts = ['top-playing-now', 'up-and-coming', 'top-rated', 'most-engaging', 'popular-worldwide'];
        const seen = new Set();

        for (const sort of sorts) {
            status.textContent = 'Загружаю подборку: ' + sort + '...';
            const data = await api(H_APIS + '/explore-api/v1/get-sort-content?sessionId=1&sortId=' + sort);
            if (data && data.games) {
                for (const g of data.games) {
                    if (!seen.has(g.rootPlaceId)) {
                        seen.add(g.rootPlaceId);
                        allGames.push({
                            id: g.rootPlaceId,
                            uid: g.universeId,
                            name: g.name,
                            tag: (g.playerCount || 0).toLocaleString('ru-RU') + ' в игре',
                            img: ''
                        });
                    }
                }
                document.getElementById('cnt').textContent = allGames.length;
                renderVirtual();
            }
        }

        // Если API подборок вернуло игры — пробуем подтянуть обложки пачками
        if (allGames.length > 0) {
            status.textContent = 'Загружено игр из Roblox: ' + allGames.length + ' (листай вниз, работает оптимизация Sega)';
            for (let i = 0; i < allGames.length; i += 50) {
                const batch = allGames.slice(i, i + 50);
                const uids = batch.map(x => x.uid).filter(Boolean).join(',');
                const th = await api(H_THUMB + '/v1/games/multiget/thumbnails?universeIds=' + uids + '&size=768x432&format=Png&isCircular=false');
                if (th && th.data) {
                    th.data.forEach(t => {
                        const game = batch.find(x => x.uid == t.universeId);
                        if (game && t.thumbnails && t.thumbnails.at(0)) game.img = t.thumbnails.at(0).imageUrl;
                    });
                    renderVirtual();
                }
            }
        } else {
            status.textContent = 'Не удалось загрузить общий список (проверь соединение). Можешь искать игры по названию или ID сверху!';
        }
    }

    // Поиск по всей базе Roblox по названию или добавление по ID
    async function searchRoblox() {
        const q = document.getElementById('q').value.trim();
        const status = document.getElementById('status');
        if (!q) return;

        // Если ввели цифры (ID игры)
        if (/^\d+$/.test(q)) {
            status.textContent = 'Ищу игру по ID ' + q + '...';
            const u = await api(H_APIS + '/universes/v1/places/' + q + '/universe');
            let name = 'Игра #' + q;
            if (u && u.universeId) {
                const inf = await api(H_GAMES + '/v1/games?universeIds=' + u.universeId);
                if (inf && inf.data && inf.data.at(0)) name = inf.data.at(0).name;
            }
            myGames.unshift({ id: q, name: name, tag: 'ID: ' + q, img: '' });
            localStorage.setItem('rbxMy', JSON.stringify(myGames));
            document.getElementById('q').value = '';
            setTab('my');
            status.textContent = 'Добавлено: ' + name;
            return;
        }

        // Поиск по названию во всей базе Roblox
        status.textContent = 'Ищу «' + q + '» во всей базе Roblox...';
        const res = await api(H_APIS + '/search-api/omni-search?searchType=games&query=' + encodeURIComponent(q) + '&sessionId=1');
        let added = 0;
        if (res && res.searchResults) {
            res.searchResults.forEach(group => {
                (group.contents || []).forEach(g => {
                    if (g.rootPlaceId && !allGames.some(x => x.id == g.rootPlaceId)) {
                        allGames.unshift({
                            id: g.rootPlaceId,
                            uid: g.universeId,
                            name: g.name,
                            tag: (g.playerCount || 0).toLocaleString('ru-RU') + ' в игре',
                            img: ''
                        });
                        added++;
                    }
                });
            });
        }
        document.getElementById('cnt').textContent = allGames.length;
        status.textContent = added > 0 ? 'Найдено новых игр: ' + added : 'Поиск завершён.';
        renderVirtual();
    }

    window.addEventListener('scroll', renderVirtual);
    window.addEventListener('resize', renderVirtual);

    renderVirtual();
    loadAllRobloxGames();
</script>
</body>
</html>
