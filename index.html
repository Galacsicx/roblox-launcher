<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Roblox Launcher</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { margin: 0; background: linear-gradient(135deg, #1b3b6f, #0d1b36); color: #fff; min-height: 100vh; padding: 25px; }
        .wrap { max-width: 1120px; margin: 0 auto; }
        .bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; background: rgba(10,22,46,0.75); border: 1px solid #2e5699; padding: 14px 18px; border-radius: 10px; margin-bottom: 20px; }
        .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        button { background: #13294d; border: 1px solid #3562ad; color: #b8d0fa; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button.active, .btn-blue { background: #3b82f6; color: #fff; border-color: #60a5fa; }
        input { background: #0d1b36; border: 1px solid #3b6ec2; color: #fff; padding: 8px 12px; border-radius: 6px; outline: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
        .card { background: #122647; border: 1px solid #264882; border-radius: 8px; overflow: hidden; transition: 0.2s; }
        .card:hover { transform: translateY(-3px); }
        .thumb { position: relative; height: 135px; background: linear-gradient(135deg, #1e3a8a, #0f172a); display: flex; align-items: center; justify-content: center; }
        .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; position: relative; z-index: 1; }
        .thumb-title { position: absolute; color: rgba(255,255,255,0.3); font-weight: bold; font-size: 16px; text-align: center; padding: 10px; }
        .tag { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.8); color: #4ade80; font-size: 11px; padding: 3px 7px; border-radius: 4px; font-weight: bold; z-index: 2; }
        .mini-btn { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.8); color: #facc15; border: 1px solid #facc15; padding: 2px 7px; font-size: 11px; z-index: 2; }
        .del-btn { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.8); color: #ff6b6b; border: none; padding: 2px 7px; z-index: 2; }
        .body { padding: 12px; }
        .title { font-weight: bold; font-size: 14px; margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .play { display: block; text-align: center; background: #f5d142; color: #141024; text-decoration: none; font-weight: bold; padding: 9px; border-radius: 5px; font-size: 14px; }
        .play:hover { background: #ffe066; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="bar">
        <div class="row">
            <h2 style="margin:0 10px 0 0;">Roblox Launcher</h2>
            <button id="tDisc" class="active" onclick="setTab('disc')">🔥 Популярные</button>
            <button id="tMy" onclick="setTab('my')">⭐ Мои игры</button>
        </div>
        <div class="row" id="prof"></div>
    </div>

    <div class="bar">
        <input id="q" style="min-width:260px;" placeholder="Поиск или ID игры..." onkeyup="draw()">
        <button class="btn-blue" onclick="addGame()">+ Добавить по ID</button>
        <span id="msg" style="color:#93c5fd; font-size:13px;"></span>
    </div>

    <div class="grid" id="grid"></div>
</div>

<script>
    const H_APIS  = 'https://' + '://roblox.com';
    const H_GAMES = 'https://' + '://roblox.com';
    const H_THUMB = 'https://' + '://roblox.com';

    async function api(url) {
        const list = [
            url.replace('roblox.com', 'roproxy.com'),
            'https://allorigins.win' + encodeURIComponent(url),
            'https://codetabs.com' + encodeURIComponent(url)
        ];
        for (const u of list) {
            try {
                const r = await fetch(u, { signal: AbortSignal.timeout(8000) });
                if (r.ok) {
                    const d = await r.json();
                    if (d && !d.errors) return d;
                }
            } catch {}
        }
        return null;
    }

    function imgTag(url, alt = '') {
        if (!url) return '';
        const wsrv = 'https://wsrv.nl' + encodeURIComponent(url);
        return '<img src="' + url + '" alt="' + alt + '" onerror="if(!this.dataset.f){this.dataset.f=1;this.src=\'' + wsrv + '\';}else{this.remove();}">';
    }

    let user = localStorage.getItem('rbxNick') || '';
    let tab = 'disc';
    let my = JSON.parse(localStorage.getItem('rbxMy')) || [];
    let disc = [
        { id: '2753915549', uid: '994732206', name: 'Blox Fruits', tag: 'Загружаю...', img: '' },
        { id: '4924922222', uid: '1686885941', name: 'Brookhaven RP', tag: 'Загружаю...', img: '' },
        { id: '189707', uid: '65033', name: 'Natural Disaster Survival', tag: 'Загружаю...', img: '' },
        { id: '920587237', uid: '383310974', name: 'Adopt Me!', tag: 'Загружаю...', img: '' },
        { id: '142823291', uid: '66654135', name: 'Murder Mystery 2', tag: 'Загружаю...', img: '' },
        { id: '6516141723', uid: '2440500124', name: 'DOORS', tag: 'Загружаю...', img: '' },
        { id: '286090429', uid: '111958650', name: 'Arsenal', tag: 'Загружаю...', img: '' },
        { id: '13772394625', uid: '4777817887', name: 'Blade Ball', tag: 'Загружаю...', img: '' },
        { id: '155615604', uid: '73885730', name: 'Prison Life', tag: 'Загружаю...', img: '' },
        { id: '6872265039', uid: '2619619496', name: 'BedWars', tag: 'Загружаю...', img: '' },
        { id: '537413528', uid: '210851291', name: 'Build A Boat For Treasure', tag: 'Загружаю...', img: '' },
        { id: '3956818381', uid: '1335695570', name: 'Ninja Legends', tag: 'Загружаю...', img: '' }
    ];

    function drawProf() {
        const el = document.getElementById('prof');
        el.innerHTML = user
            ? '<b>@' + user + '</b> <button style="border-color:#ef4444;color:#f87171;padding:4px 8px;font-size:11px;" onclick="user=\'\';localStorage.removeItem(\'rbxNick\');drawProf()">Выйти</button>'
            : '<input id="uIn" placeholder="Твой ник в Roblox" onkeydown="if(event.key===\'Enter\')login()"><button class="btn-blue" onclick="login()">Войти</button>';
    }

    function login() {
        const v = document.getElementById('uIn').value.replace('@', '').trim();
        if (!v) return;
        user = v;
        localStorage.setItem('rbxNick', user);
        drawProf();
    }

    function draw() {
        const f = document.getElementById('q').value.toLowerCase();
        const list = (tab === 'disc' ? disc : my).filter(g => g.name.toLowerCase().includes(f) || String(g.id).includes(f));
        document.getElementById('grid').innerHTML = list.length ? list.map((g, i) =>
            '<div class="card">' +
                '<div class="thumb">' +
                    '<span class="thumb-title">' + g.name + '</span>' +
                    '<span class="tag">● ' + (g.tag || 'Roblox') + '</span>' +
                    (tab === 'my' ? '<button class="del-btn" onclick="my.splice(' + i + ',1);save()">✕</button>' : '<button class="mini-btn" onclick="fav(' + i + ')">★ В мои</button>') +
                    imgTag(g.img, g.name) +
                '</div>' +
                '<div class="body"><div class="title">' + g.name + '</div><a class="play" href="roblox://experiences/start?placeId=' + g.id + '">▶ PLAY</a></div>' +
            '</div>'
        ).join('') : '<p style="color:#93c5fd;">Пусто. Добавь игру по ID сверху!</p>';
    }

    const save = () => { localStorage.setItem('rbxMy', JSON.stringify(my)); draw(); };
    const setTab = t => { tab = t; document.getElementById('tDisc').className = t === 'disc' ? 'active' : ''; document.getElementById('tMy').className = t === 'my' ? 'active' : ''; draw(); };
    const fav = i => {
        const g = { ...disc.at(i) };
        const ex = my.findIndex(x => x.id === g.id);
        if (ex !== -1) my[ex] = g; else my.unshift(g);
        save();
        document.getElementById('msg').textContent = 'Добавлено!';
        setTimeout(() => document.getElementById('msg').textContent = '', 1500);
    };

    async function loadThumbs(gamesList) {
        for (const g of gamesList) {
            if (!g.uid) {
                const u = await api(H_APIS + '/universes/v1/places/' + g.id + '/universe');
                if (u && u.universeId) g.uid = u.universeId;
            }
        }
        const uids = gamesList.map(g => g.uid).filter(Boolean).join(',');
        if (!uids) return;

        const [th, inf] = await Promise.all([
            api(H_THUMB + '/v1/games/multiget/thumbnails?universeIds=' + uids + '&size=768x432&format=Png&isCircular=false'),
            api(H_GAMES + '/v1/games?universeIds=' + uids)
        ]);
        if (th && th.data) {
            th.data.forEach(t => {
                gamesList.filter(x => x.uid == t.universeId).forEach(g => {
                    if (t.thumbnails && t.thumbnails.at(0)) g.img = t.thumbnails.at(0).imageUrl;
                });
            });
        }
        if (inf && inf.data) {
            inf.data.forEach(i => {
                gamesList.filter(x => x.uid == i.id).forEach(g => {
                    g.tag = i.playing.toLocaleString('ru-RU') + ' в игре';
                });
            });
        }
    }

    async function addGame() {
        const inp = document.getElementById('q');
        const id = inp.value.match(/\d+/)?.at(0);
        if (!id) return;
        document.getElementById('msg').textContent = 'Загружаю игру и фото...';
        let name = '', img = '', uid = '';
        const u = await api(H_APIS + '/universes/v1/places/' + id + '/universe');
        if (u && u.universeId) {
            uid = u.universeId;
            const [inf, th] = await Promise.all([
                api(H_GAMES + '/v1/games?universeIds=' + uid),
                api(H_THUMB + '/v1/games/multiget/thumbnails?universeIds=' + uid + '&size=768x432&format=Png&isCircular=false')
            ]);
            if (inf && inf.data && inf.data.at(0)) name = inf.data.at(0).name;
            if (th && th.data && th.data.at(0) && th.data.at(0).thumbnails && th.data.at(0).thumbnails.at(0)) img = th.data.at(0).thumbnails.at(0).imageUrl;
        }
        document.getElementById('msg').textContent = '';
        if (!name) name = prompt('Название игры:', 'Игра #' + id);
        if (!name) return;
        my.unshift({ id, uid, name, tag: 'ID: ' + id, img });
        inp.value = ''; save(); setTab('my');
    }

    (async () => {
        await loadThumbs(disc);
        disc.forEach(g => { if (g.tag === 'Загружаю...') g.tag = 'Roblox'; });
        draw();

        if (my.length > 0) {
            await loadThumbs(my);
            save();
        }
    })();

    drawProf(); draw();
</script>
</body>
</html>
