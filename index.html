<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Roblox Launcher Pro</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body {
            margin: 0;
            background: linear-gradient(135deg, #1b3b6f 0%, #0d1b36 100%);
            color: white;
            min-height: 100vh;
            padding: 30px;
        }
        .container { max-width: 1120px; margin: 0 auto; }

        /* Шапка */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            background: rgba(10, 22, 46, 0.75);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid #2e5699;
        }
        .left-header { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
        .tabs { display: flex; gap: 8px; }
        .tab-btn {
            background: #13294d;
            border: 1px solid #3562ad;
            color: #b8d0fa;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .tab-btn.active {
            background: #3b82f6;
            color: white;
            border-color: #60a5fa;
        }

        /* Профиль */
        .profile-box {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #13294d;
            padding: 7px 14px;
            border-radius: 8px;
            border: 1px solid #3b6ec2;
        }
        .avatar-wrap {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border: 2px solid #4ade80;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: white;
            flex-shrink: 0;
            cursor: pointer;
            position: relative;
        }
        .avatar-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .username-text { font-weight: bold; font-size: 15px; color: #ffffff; }
        .user-sub { font-size: 11px; color: #4ade80; }
        .login-input {
            background: #0d1b36;
            border: 1px solid #3b6ec2;
            color: white;
            padding: 7px 10px;
            border-radius: 5px;
            font-size: 13px;
            width: 180px;
            outline: none;
        }
        .small-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .small-btn:hover { background: #2563eb; }
        .logout-btn {
            background: transparent;
            border: 1px solid #ef4444;
            color: #f87171;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            margin-left: 4px;
        }

        /* Панель поиска и добавления */
        .control-bar {
            background: rgba(10, 22, 46, 0.75);
            border: 1px solid #2e5699;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-input {
            background: #13294d;
            border: 1px solid #3b6ec2;
            color: white;
            padding: 10px 14px;
            border-radius: 5px;
            font-size: 14px;
            outline: none;
            min-width: 270px;
        }
        .add-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .add-btn:hover { background: #2563eb; }

        /* Сетка игр */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 18px;
        }
        .card {
            background: #122647;
            border: 1px solid #264882;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }
        .card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.45); }
        .thumb-wrap { position: relative; height: 135px; background: #0f1f3d; overflow: hidden; }
        .thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
        .badge-online {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0, 0, 0, 0.78);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            color: #4ade80;
            font-weight: bold;
            z-index: 2;
        }
        .del-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0,0,0,0.78);
            color: #ff6b6b;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            padding: 3px 8px;
            font-weight: bold;
            z-index: 2;
        }
        .fav-btn {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0,0,0,0.78);
            color: #facc15;
            border: 1px solid #facc15;
            border-radius: 4px;
            cursor: pointer;
            padding: 2px 7px;
            font-size: 12px;
            z-index: 2;
        }
        .img-edit-btn {
            position: absolute;
            bottom: 6px;
            left: 6px;
            background: rgba(0,0,0,0.78);
            color: #93c5fd;
            border: 1px solid #3b82f6;
            border-radius: 4px;
            cursor: pointer;
            padding: 2px 7px;
            font-size: 11px;
            z-index: 2;
        }
        .card-body { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
        .title { font-weight: bold; font-size: 15px; margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .play-btn {
            display: block;
            text-align: center;
            background: #f5d142;
            color: #141024;
            text-decoration: none;
            font-weight: bold;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
        }
        .play-btn:hover { background: #ffe066; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <div class="left-header">
            <h2 style="margin:0;">Roblox Launcher</h2>
            <div class="tabs">
                <button class="tab-btn active" id="tabDiscover" onclick="switchTab('discover')">🔥 Популярные игры</button>
                <button class="tab-btn" id="tabMy" onclick="switchTab('my')">⭐ Мои игры</button>
            </div>
        </div>

        <div class="profile-box" id="profileBox"></div>
    </div>

    <div class="control-bar">
        <input type="text" class="search-input" id="searchInput" placeholder="Поиск по названию или вставь ID игры..." onkeyup="renderGames()">
        <button class="add-btn" onclick="addGameById()">+ Добавить игру по ID</button>
        <span id="status" style="color: #93c5fd; font-size: 13px;"></span>
    </div>

    <div class="games-grid" id="gamesGrid"></div>
</div>

<!-- Скрытый выбор картинки с ПК -->
<input type="file" id="filePicker" accept="image/*" style="display:none">

<script>
    // Встроенный генератор красивых обложек (работает мгновенно и без интернета)
    function makePoster(title, color1 = '#1e40af', color2 = '#0f172a') {
        const cleanTitle = title.replace(/[<>&'"]/g, '');
        const svg = `<svg xmlns="http://w3.org" width="768" height="432" viewBox="0 0 768 432">
            <defs>
                <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="${color1}"/>
                    <stop offset="100%" stop-color="${color2}"/>
                </linearGradient>
            </defs>
            <rect width="768" height="432" fill="url(#g)"/>
            <circle cx="680" cy="70" r="140" fill="rgba(255,255,255,0.05)"/>
            <circle cx="90" cy="380" r="110" fill="rgba(59,130,246,0.12)"/>
            <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-weight="bold" font-size="38">${cleanTitle}</text>
            <text x="50%" y="70%" dominant-baseline="middle" text-anchor="middle" fill="#93c5fd" font-family="Segoe UI, Arial, sans-serif" font-size="18">ROBLOX EXPERIENCE</text>
        </svg>`;
        return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    function proxyImg(url) {
        if (!url) return '';
        if (url.startsWith('data:') || url.startsWith('https://wsrv.nl')) return url;
        return 'https://wsrv.nl?url=' + encodeURIComponent(url);
    }

    async function fetchRobloxGet(url) {
        const proxies = [
            url.replace('roblox.com', 'roproxy.com'),
            'https://allorigins.win' + encodeURIComponent(url),
            'https://corsproxy.io?' + encodeURIComponent(url)
        ];
        for (const pUrl of proxies) {
    try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 3500);
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timer);
        if (res.ok) {
            const data = await res.json();
            if (data && !data.errors) return data;
        }
    } catch (e) {}
    return null;
}

function proxyImg(url) {
    if (!url) return '';
    return 'https://images.weserv.nl/?url=' + encodeURIComponent(url.replace(/^https?:\/\//, ''));
}

function makePoster(name, c1, c2) {
    const safe = String(name || 'Roblox').replace(/[<>&"']/g, '');
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="768" height="432" viewBox="0 0 768 432">
        <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="${c1}"/>
                <stop offset="100%" stop-color="${c2}"/>
            </linearGradient>
        </defs>
        <rect width="768" height="432" fill="url(#g)"/>
        <text x="384" y="216" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">${safe}</text>
    </svg>`;
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

// ============================================================
// 1. ПРОФИЛЬ И АВАТАРКА
// ============================================================
let savedUser = JSON.parse(localStorage.getItem('robloxUserProfile')) || null;

function renderProfile() {
    const box = document.getElementById('profileBox');
    if (savedUser) {
        const letter = (savedUser.displayName || savedUser.name || 'R').charAt(0).toUpperCase();
        const imgTag = savedUser.avatar
            ? `<img src="${proxyImg(savedUser.avatar)}" onerror="this.remove()" alt="Avatar">`
            : '';
        box.innerHTML = `
            <div class="avatar-wrap" onclick="pickCustomAvatar()" title="Нажми, чтобы поставить свою аватарку с ПК">${imgTag}${!savedUser.avatar ? letter : ''}</div>
            <div>
                <div class="username-text">${savedUser.displayName || savedUser.name} <span style="color:#93c5fd; font-weight:normal; font-size:12px;">(@${savedUser.name})</span></div>
                <div class="user-sub">● ${savedUser.id ? 'ID: ' + savedUser.id : 'Кликни на кружок для фото'}</div>
            </div>
            <button class="logout-btn" onclick="logoutUser()">Сменить</button>`;
    } else {
        box.innerHTML = `
            <input type="text" class="login-input" id="usernameInput" placeholder="Ник или User ID" onkeydown="if(event.key==='Enter') loginUser()">
            <button class="small-btn" onclick="loginUser()">Войти</button>`;
    }
}

function pickCustomAvatar() {
    const picker = document.getElementById('filePicker');
    picker.onchange = (e) => {
        const file = e.target.files.at(0);
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
            savedUser.avatar = reader.result;
            localStorage.setItem('robloxUserProfile', JSON.stringify(savedUser));
            renderProfile();
        };
        reader.readAsDataURL(file);
    };
    picker.click();
}

async function loginUser() {
    const input = document.getElementById('usernameInput');
    const rawQuery = input.value.replace('@', '').trim();
    if (!rawQuery) return;
    input.disabled = true;
    input.value = 'Ищу аватар...';

    let userId = '';
    let realName = rawQuery;
    let displayName = rawQuery;
    let avatarUrl = '';

    if (/^\d+$/.test(rawQuery)) {
        userId = rawQuery;
        const userInfo = await fetchRobloxGet(`https://users.roblox.com/v1/users/${userId}`);
        if (userInfo && userInfo.name) {
            realName = userInfo.name;
            displayName = userInfo.displayName || userInfo.name;
        }
    } else {
        const searchData = await fetchRobloxGet(`https://users.roblox.com/v1/users/search?keyword=${encodeURIComponent(rawQuery)}&limit=10`);
        if (searchData && searchData.data && searchData.data.length > 0) {
            const lower = rawQuery.toLowerCase();
            const found = searchData.data.find(u => u.name.toLowerCase() === lower || u.displayName.toLowerCase() === lower) || searchData.data.at(0);
            userId = found.id;
            realName = found.name;
            displayName = found.displayName;
        }
    }

    if (userId) {
        const thumbData = await fetchRobloxGet(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${userId}&size=150x150&format=Png&isCircular=false`);
        if (thumbData && thumbData.data && thumbData.data.length > 0) {
            avatarUrl = thumbData.data.at(0).imageUrl;
        }
    }

    savedUser = {
        id: userId,
        name: realName,
        displayName: displayName,
        avatar: avatarUrl
    };
    localStorage.setItem('robloxUserProfile', JSON.stringify(savedUser));
    renderProfile();
}

function logoutUser() {
    savedUser = null;
    localStorage.removeItem('robloxUserProfile');
    renderProfile();
}

// 2. КАТАЛОГ ИГР
// ============================================================
let discoverGames = [
    { id: '2753915549', universeId: '994732206', name: 'Blox Fruits', playing: 'Популярное', c1: '#1d4ed8', c2: '#0f172a', img: '' },

    { id: '142823291', universeId: '66654135', name: 'Murder Mystery 2', playing: 'Экшен', c1: '#991b1b', c2: '#0f172a', img: '' },
    { id: '6516141723', universeId: '2440500124', name: 'DOORS 👁️', playing: 'Хоррор', c1: '#4c1d95', c2: '#090d16', img: '' },
    { id: '286090429', universeId: '111958650', name: 'Arsenal', playing: 'Шутер', c1: '#c2410c', c2: '#0f172a', img: '' },
    { id: '13772394625', universeId: '4777817887', name: 'Blade Ball', playing: 'Экшен', c1: '#6d28d9', c2: '#0f172a', img: '' },

    { id: '537413528', universeId: '210851291', name: 'Build A Boat For Treasure', playing: 'Приключения', c1: '#0f766e', c2: '#0f172a', img: '' },
    { id: '3956818381', universeId: '1335695570', name: 'Ninja Legends', playing: 'Симулятор', c1: '#4338ca', c2: '#0f172a', img: '' }
];

let currentTab = 'discover';
let myGames = JSON.parse(localStorage.getItem('myRobloxGames')) || [];

async function refreshLiveThumbnails() {
    const uids = discoverGames.map(g => g.universeId).join(',');
    const [thumbData, infoData] = await Promise.all([
        fetchRobloxGet(`https://thumbnails.roblox.com/v1/games/multiget/thumbnails?universeIds=${uids}&size=768x432&format=Png&isCircular=false`),
        fetchRobloxGet(`https://games.roblox.com/v1/games?universeIds=${uids}`)
    ]);
    if (thumbData && thumbData.data) {
        const map = {};
        thumbData.data.forEach(t => {
            if (t.thumbnails && t.thumbnails.length > 0) map[t.targetId || t.universeId] = t.thumbnails.at(0).imageUrl;
        });
        discoverGames.forEach(g => {
            if (map[g.universeId]) g.img = map[g.universeId];
        });
    }
    if (infoData && infoData.data) {
        const infoMap = {};
        infoData.data.forEach(i => { infoMap[i.id] = i.playing; });
        discoverGames.forEach(g => {
            if (infoMap[g.universeId]) g.playing = infoMap[g.universeId].toLocaleString('ru-RU') + ' в игре';
        });
    }
    renderGames();
}

function renderGames() {
    const grid = document.getElementById('gamesGrid');
    const filterText = document.getElementById('searchInput').value.toLowerCase();
    grid.innerHTML = '';
    const list = currentTab === 'discover' ? discoverGames : myGames;
    if (list.length === 0 && currentTab === 'my') {
        grid.innerHTML = 'Пока пусто. Нажми «★ В мои» на любой игре или вставь ID игры сверху!';
        return;
    }
    list.forEach((game, index) => {
        if (filterText && !game.name.toLowerCase().includes(filterText) && !String(game.id).includes(filterText)) {
            return;
        }
        const topRightBtn = currentTab === 'my'
            ? `<button class="del-btn" onclick="removeGame(${index})" title="Удалить">✕</button>`
            : `<button class="fav-btn" onclick="saveToMy(${index})">★ В мои</button>`;
        const customImgBtn = currentTab === 'my'
            ? `<button class="img-edit-btn" onclick="pickGameImage(${index})" title="Загрузить свою картинку с ПК">🖼 Фото</button>`
            : '';
        const poster = makePoster(game.name, game.c1 || '#1e40af', game.c2 || '#0f172a');
        const imgSrc = game.img ? proxyImg(game.img) : poster;
        grid.innerHTML += `<div class="card">
            <div class="thumb-wrap">
                <span class="badge-online">● ${game.playing || 'Roblox'}</span>
                ${topRightBtn} ${customImgBtn}
                <img class="thumb" src="${imgSrc}" onerror="this.src='${poster}'" alt="${game.name}">
            </div>
            <div class="card-body">
                <div class="title" title="${game.name}">${game.name}</div>
                <a href="roblox://experiences/start?placeId=${game.id}" class="play-btn">▶ PLAY</a>
            </div>
        </div>`;
    });
}

function pickGameImage(index) {
    const picker = document.getElementById('filePicker');
    picker.onchange = (e) => {
        const file = e.target.files.at(0);
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
            myGames.at(index).img = reader.result;
            localStorage.setItem('myRobloxGames', JSON.stringify(myGames));
            renderGames();
        };
        reader.readAsDataURL(file);
    };
    picker.click();
}

function saveToMy(index) {
    const game = { ...discoverGames.at(index) };
    if (!myGames.some(g => g.id === game.id)) {
        myGames.unshift(game);
        localStorage.setItem('myRobloxGames', JSON.stringify(myGames));
    }
    const status = document.getElementById('status');
    status.textContent = `«${game.name}» добавлена в Мои игры!`;
    setTimeout(() => status.textContent = '', 2000);
}

function switchTab(tab) {
    currentTab = tab;
    document.getElementById('tabDiscover').classList.toggle('active', tab === 'discover');
    document.getElementById('tabMy').classList.toggle('active', tab === 'my');
    renderGames();
}

async function addGameById() {
    const input = document.getElementById('searchInput');
    const status = document.getElementById('status');
    const match = input.value.match(/\d+/);
    if (!match) {
        status.textContent = 'Вставь ID или ссылку на игру!';
        return;
    }
    const placeId = match.at(0);
    status.textContent = 'Ищу игру...';
    let gameName = '';
    let imgUrl = '';
    const uData = await fetchRobloxGet(`https://apis.roblox.com/universes/v1/places/${placeId}/universe`);
    if (uData && uData.universeId) {
        const uid = uData.universeId;
        const [infoData, thumbData] = await Promise.all([
            fetchRobloxGet(`https://games.roblox.com/v1/games?universeIds=${uid}`),
            fetchRobloxGet(`https://thumbnails.roblox.com/v1/games/multiget/thumbnails?universeIds=${uid}&size=768x432&format=Png&isCircular=false`)
        ]);
        if (infoData && infoData.data && infoData.data.length > 0) {
            gameName = infoData.data.at(0).name;
        }
        if (thumbData && thumbData.data && thumbData.data.length > 0 && thumbData.data.at(0).thumbnails.length > 0) {
            imgUrl = thumbData.data.at(0).thumbnails.at(0).imageUrl;
        }
    }
    if (!gameName) {
        status.textContent = '';
        gameName = prompt('Введи название для этой игры (ID: ' + placeId + '):', 'Моя игра #' + placeId);
        if (!gameName) return;
    }
    myGames.unshift({
        id: placeId,
        name: gameName,
        playing: 'ID: ' + placeId,
        img: imgUrl
    });
    localStorage.setItem('myRobloxGames', JSON.stringify(myGames));
    input.value = '';
    status.textContent = 'Добавлено!';
    switchTab('my');
    setTimeout(() => status.textContent = '', 2000);
}

function removeGame(index) {
    myGames.splice(index, 1);
    localStorage.setItem('myRobloxGames', JSON.stringify(myGames));
    renderGames();
}

// ============================================================
// СТАРТ
// ============================================================
renderProfile();
renderGames();
refreshLiveThumbnails();
