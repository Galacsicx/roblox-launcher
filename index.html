<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Roblox Launcher</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { margin: 0; background: linear-gradient(135deg, #1b3b6f, #0d1b36); color: #fff; min-height: 100vh; padding: 25px; }
        .wrap { max-width: 1100px; margin: 0 auto; }
        .bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; background: rgba(10,22,46,0.75); border: 1px solid #2e5699; padding: 14px 18px; border-radius: 10px; margin-bottom: 20px; }
        .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        button { background: #13294d; border: 1px solid #3562ad; color: #b8d0fa; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button.active, .btn-blue { background: #3b82f6; color: #fff; border-color: #60a5fa; }
        input { background: #0d1b36; border: 1px solid #3b6ec2; color: #fff; padding: 8px 12px; border-radius: 6px; outline: none; }
        .avatar { width: 42px; height: 42px; border-radius: 50%; background: #2563eb; border: 2px solid #4ade80; overflow: hidden; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; flex-shrink: 0; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
        .card { background: #122647; border: 1px solid #264882; border-radius: 8px; overflow: hidden; transition: 0.2s; }
        .card:hover { transform: translateY(-3px); }
        .thumb { position: relative; height: 130px; background: linear-gradient(135deg, #1e3a8a, #0f172a); display: flex; align-items: center; justify-content: center; }
        .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; position: relative; z-index: 1; }
        .thumb-title { position: absolute; color: rgba(255,255,255,0.25); font-weight: bold; font-size: 16px; text-align: center; padding: 10px; }
        .tag { position: absolute; top: 8px; left: 8px; background: rgba(0,0,0,0.8); color: #4ade80; font-size: 11px; padding: 3px 7px; border-radius: 4px; font-weight: bold; z-index: 2; }
        .mini-btn { position: absolute; bottom: 6px; right: 6px; background: rgba(0,0,0,0.8); color: #facc15; border: 1px solid #facc15; padding: 2px 7px; font-size: 11px; z-index: 2; }
        .del-btn { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.8); color: #ff6b6b; border: none; padding: 2px 7px; z-index: 2; }
        .body { padding: 12px; }
        .title { font-weight: bold; font-size: 14px; margin-bottom: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .play { display: block; text-align: center; background: #f5d142; color: #141024; text-decoration: none; font-weight: bold; padding: 9px; border-radius: 5px; font-size: 14px; }
        .play:hover { background: #ffe066; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="bar">
        <div class="row">
            <h2 style="margin:0 10px 0 0;">Roblox Launcher</h2>
            <button id="tDisc" class="active" onclick="setTab('disc')">🔥 Популярные</button>
            <button id="tMy" onclick="setTab('my')">⭐ Мои игры</button>
        </div>
        <div class="row" id="prof"></div>
    </div>

    <div class="bar">
        <input id="q" style="min-width:250px;" placeholder="Поиск или ID игры..." onkeyup="draw()">
        <button class="btn-blue" onclick="addGame()">+ Добавить по ID</button>
        <span id="msg" style="color:#93c5fd; font-size:13px;"></span>
    </div>

    <div class="grid" id="grid"></div>
</div>
<input type="file" id="picker" accept="image/*" hidden>

<script>
    async function api(url) {
        const list = [
            url.replace('roblox.com', 'roproxy.com'),
            'https://corsproxy.io?' + encodeURIComponent(url),
            'https://allorigins.win' + encodeURIComponent(url),
            'https://codetabs.com' + encodeURIComponent(url)
        ];
        for (const u of list) {
            try {
                const r = await fetch(u, { signal: AbortSignal.timeout(4500) });
                if (r.ok) {
                    const d = await r.json();
                    if (d && !d.errors) return d;
                }
            } catch {}
        }
        return null;
    }

    function imgTag(url, alt = '') {
        if (!url) return '';
        if (url.startsWith('data:')) return `<img src="${url}" alt="${alt}">`;
        const wsrv = 'https://wsrv.nl' + encodeURIComponent(url);
        return `<img src="${url}" alt="${alt}" onerror="if(!this.dataset.f){this.dataset.f=1;this.src='${wsrv}';}else{this.remove();}">`;
    }

    let user = JSON.parse(localStorage.getItem('rbxUser')) || null;
    let tab = 'disc';
    let my = JSON.parse(localStorage.getItem('rbxMy')) || [];
    let disc = [
        { id: '2753915549', uid: '994732206', name: 'Blox Fruits', tag: 'Загрузка...', img: '' },
        { id: '4924922222', uid: '1686885941', name: 'Brookhaven RP', tag: 'Загрузка...', img: '' },
        { id: '189707', uid: '65033', name: 'Natural Disaster Survival', tag: 'Загрузка...', img: '' },
        { id: '920587237', uid: '383310974', name: 'Adopt Me!', tag: 'Загрузка...', img: '' },
        { id: '142823291', uid: '66654135', name: 'Murder Mystery 2', tag: 'Загрузка...', img: '' },
        { id: '6516141723', uid: '2440500124', name: 'DOORS', tag: 'Загрузка...', img: '' },
        { id: '286090429', uid: '111958650', name: 'Arsenal', tag: 'Загрузка...', img: '' },
        { id: '13772394625', uid: '4777817887', name: 'Blade Ball', tag: 'Загрузка...', img: '' },
        { id: '155615604', uid: '73885730', name: 'Prison Life', tag: 'Загрузка...', img: '' },
        { id: '6872265039', uid: '2619619496', name: 'BedWars', tag: 'Загрузка...', img: '' },
        { id: '537413528', uid: '210851291', name: 'Build A Boat For Treasure', tag: 'Загрузка...', img: '' },
        { id: '3956818381', uid: '1335695570', name: 'Ninja Legends', tag: 'Загрузка...', img: '' }
    ];

    function drawProf() {
        const el = document.getElementById('prof');
        if (!user) {
            el.innerHTML = `<input id="uIn" placeholder="Ник или User ID" onkeydown="if(event.key==='Enter')login()"><button class="btn-blue" onclick="login()">Войти</button>`;
            return;
        }
        el.innerHTML = `
            <div class="avatar" onclick="pickImg(-1)" title="Нажми, чтобы сменить фото">
                ${user.img ? imgTag(user.img, user.name) : user.name.at(0).toUpperCase()}
            </div>
            <div>
                <b>${user.display || user.name}</b> <span style="color:#93c5fd;font-size:12px;">(@${user.name})</span>
                <div style="font-size:11px;color:#4ade80;">● ${user.id ? 'ID: ' + user.id : 'В сети'}</div>
            </div>
            <button style="border-color:#ef4444;color:#f87171;padding:4px 8px;font-size:11px;" onclick="user=null;localStorage.removeItem('rbxUser');drawProf()">Выйти</button>`;
    }

    async function login() {
        const inp = document.getElementById('uIn');
        const v = inp.value.replace('@', '').trim();
        if (!v) return;
        inp.disabled = true; inp.value = 'Ищу аватар...';

        let id = /^\d+$/.test(v) ? v : '';
        let name = v;
        let display = v;
        let img = '';

        if (id) {
            const u = await api(`https://roblox.com{id}`);
            if (u?.name) { name = u.name; display = u.displayName || u.name; }
        } else {
            const s = await api(`https://roblox.com{encodeURIComponent(v)}&limit=10`);
            const f = s?.data?.find(u => u.name.toLowerCase() === v.toLowerCase() || u.displayName.toLowerCase() === v.toLowerCase()) || s?.data?.at(0);
            if (f) {
                id = f.id;
                name = f.name;
                display = f.displayName || f.name;
            }
        }

        if (id) {
            const t = await api(`https://roblox.com{id}&size=150x150&format=Png&isCircular=false`);
            img = t?.data?.at(0)?.imageUrl || '';
        }

        user = { id, name, display, img };
        localStorage.setItem('rbxUser', JSON.stringify(user));
        drawProf();
    }

    function draw() {
        const f = document.getElementById('q').value.toLowerCase();
        const list = (tab === 'disc' ? disc : my).filter(g => g.name.toLowerCase().includes(f) || String(g.id).includes(f));
        document.getElementById('grid').innerHTML = list.length ? list.map((g, i) => `
            <div class="card">
                <div class="thumb">
                    <span class="thumb-title">${g.name}</span>
                    <span class="tag">● ${g.tag || 'Roblox'}</span>
                    ${tab === 'my' ? `<button class="del-btn" onclick="my.splice(${i},1);save()">✕</button><button class="mini-btn" onclick="pickImg(${i})">🖼 Фото</button>` : `<button class="mini-btn" onclick="fav(${i})">★ В мои</button>`}
                    ${imgTag(g.img, g.name)}
                </div>
                <div class="body"><div class="title">${g.name}</div><a class="play" href="roblox://experiences/start?placeId=${g.id}">▶ PLAY</a></div>
            </div>`).join('') : '<p style="color:#93c5fd;">Пусто. Добавь игру по ID сверху!</p>';
    }

    const save = () => { localStorage.setItem('rbxMy', JSON.stringify(my)); draw(); };
    const setTab = t => { tab = t; document.getElementById('tDisc').className = t === 'disc' ? 'active' : ''; document.getElementById('tMy').className = t === 'my' ? 'active' : ''; draw(); };
    const fav = i => { const g = { ...disc.at(i) }; if (!my.some(x => x.id === g.id)) { my.unshift(g); save(); } document.getElementById('msg').textContent = 'Добавлено!'; setTimeout(() => document.getElementById('msg').textContent = '', 1500); };

    function pickImg(idx) {
        const p = document.getElementById('picker');
        p.onchange = e => {
            const file = e.target.files.at(0);
            if (!file) return;
            const r = new FileReader();
            r.onload = () => {
                if (idx === -1) { user.img = r.result; localStorage.setItem('rbxUser', JSON.stringify(user)); drawProf(); }
                else { my.at(idx).img = r.result; save(); }
            };
            r.readAsDataURL(file);
        };
        p.click();
    }

    async function addGame() {
        const inp = document.getElementById('q');
        const id = inp.value.match(/\d+/)?.at(0);
        if (!id) return;
        document.getElementById('msg').textContent = 'Ищу в Roblox...';
        let name = '', img = '';
        const u = await api(`https://roblox.com{id}/universe`);
        if (u?.universeId) {
            const [inf, th] = await Promise.all([
                api(`https://roblox.com{u.universeId}`),
                api(`https://roblox.com{u.universeId}&size=768x432&format=Png&isCircular=false`)
            ]);
            name = inf?.data?.at(0)?.name || '';
            img = th?.data?.at(0)?.thumbnails?.at(0)?.imageUrl || '';
        }
        document.getElementById('msg').textContent = '';
        if (!name) name = prompt('Название игры:', 'Игра #' + id);
        if (!name) return;
        my.unshift({ id, name, tag: 'ID: ' + id, img });
        inp.value = ''; save(); setTab('my');
    }

    (async () => {
        const uids = disc.map(g => g.uid).join(',');
        const [th, inf] = await Promise.all([
            api(`https://roblox.com{uids}&size=768x432&format=Png&isCircular=false`),
            api(`https://roblox.com{uids}`)
        ]);
        th?.data?.forEach(t => { const g = disc.find(x => x.uid == t.universeId); if (g && t.thumbnails?.at(0)) g.img = t.thumbnails.at(0).imageUrl; });
        inf?.data?.forEach(i => { const g = disc.find(x => x.uid == i.id); if (g) g.tag = i.playing.toLocaleString('ru-RU') + ' в игре'; });
        disc.forEach(g => { if (g.tag === 'Загрузка...') g.tag = 'Roblox'; });
        draw();
    })();

    drawProf(); draw();
</script>
</body>
</html>
